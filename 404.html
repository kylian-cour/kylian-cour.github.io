<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="3;url=/">
  <title>Page introuvable – Kylian Couroussé</title>
  <style>
    :root { --bg:#f9f9f9; --text:#4e4e4e; --title:#0a090f; --accent:#0078ff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#060606; --text:#d4d4d4; --title:#ffffff; } }
    html, body { height:100%; margin:0; }
    body { display:flex; align-items:center; justify-content:center; text-align:center;
           font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
           background:var(--bg); color:var(--text); padding:24px; box-sizing:border-box; }
    h1 { font-size:72px; margin:0 0 8px; color:var(--accent); }
    h2 { font-size:22px; margin:0 0 16px; color:var(--title); }
    p { margin:0 0 24px; }
    a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
            padding:12px 28px; border-radius:50px; font-weight:500; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>Cette page n’existe pas.</h2>
    <p>Vous allez être redirigé vers l’accueil dans quelques secondes.</p>
    <a class="btn" href="/">Retour à l’accueil</a>
  </main>
</body>
</html>
